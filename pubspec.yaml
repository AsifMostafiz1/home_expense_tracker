name: demo_project
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  get: ^4.7.3
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.3
  url_launcher: ^6.3.1
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^19.5.0
  http: ^1.6.0
  googleapis_auth: ^1.6.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  # Storage lives in Supabase, not Firebase — Firebase Storage requires a
  # billing account this project does not have.
  supabase_flutter: ^2.17.2

  # Pinned to 6.x on purpose. `supabase_flutter` pulls this in and accepts
  # `>=6.4.1 <8.0.0`, but resolution had settled on 7.2.1 — which declares
  # `sdk: ^3.12.0` and so refuses to compile against the Dart 3.11 this
  # Flutter ships. Nothing in the app calls it directly; the constraint is
  # only here to keep the resolver inside what the SDK can build. Drop it once
  # the toolchain is on Flutter 3.44 or newer.
  app_links: ^6.4.1
  # Pinned for the same toolchain reason as app_links. 3.11.0 declares
  # `sdk: ^3.6.0` but calls `Object.isA<JSObject>()`, an extension that only
  # exists from Dart 3.12 — so the web build fails inside the package on the
  # Dart 3.11 this Flutter ships. 3.10.0 predates that call. Drop the pin once
  # the toolchain is on Flutter 3.44 or newer.
  firebase_core_web: 3.10.0
  firebase_app_check: any
  firebase_auth: any
  permission_handler: ^11.3.1
  # Offline support: knowing when the connection comes back (queued expenses
  # and receipts are flushed then), and a persistent folder for receipts
  # picked while offline, whose upload has to wait.
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  # Delivers what was saved offline even if the app is not opened again: a
  # one-off job the OS runs once there is a network, in a headless isolate,
  # that drains Firestore's queue and uploads the waiting receipts.
  workmanager: ^0.10.5
  pdf: ^3.12.0
  printing: ^5.14.3
  # Saving a picture out of the app and onto the device: the gallery on
  # Android and iOS, where a downloaded photo is looked for. Desktop has no
  # gallery, and the web has neither — both are handled without it, in
  # `image_saver_io.dart` and `image_saver_web.dart`.
  gal: ^2.3.3
  # The browser's own APIs — a blob and an anchor, which is all a download on
  # web is. Pulled in transitively already; named here because the app now
  # imports it directly.
  web: ^1.1.1
  # Voice messages in the chat: `record` opens the microphone and reports the
  # loudness as it goes (which is what the waveform is drawn from), `just_audio`
  # plays the clips back. Both carry a web implementation, so the browser build
  # keeps working — see the toolchain notes above.
  record: ^6.2.1
  just_audio: ^0.10.6
  flutter_webrtc: ^1.6.1
  # Task reminders are scheduled with `flutter_local_notifications`, whose
  # `zonedSchedule` takes a zoned date. Already pulled in transitively by that
  # plugin; named here because the app now imports it directly — see
  # `TaskReminderService`.
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The FCM v1 sender reads the Firebase service account key from here.
  # Asset paths are relative to this file, so the key sits in the project
  # root. It is a private key and is kept out of git on purpose (.gitignore),
  # which means a fresh checkout has to be handed a copy — naming the file
  # itself rather than a folder is deliberate, so a checkout without it fails
  # the build instead of building an app that quietly sends no notifications.
  assets:
    - service_account.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
